name: macOS Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test macOS target
        run: >
          xcodebuild
          -project ClashAttackLab.xcodeproj
          -scheme ClashAttackLabMac
          -destination 'platform=macOS'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test
